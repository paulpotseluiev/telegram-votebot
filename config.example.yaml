# ═══════════════════════════════════════════════════════════════════════
#  Шаблон конфігурації. Скопіюй у config.yaml і відредагуй під себе:
#
#      cp config.example.yaml config.yaml
#
#  На старті конфіг ЗАМОРОЖУЄТЬСЯ у state.json — правки під час активної
#  вікторини на неї не впливають (щоб не зламати забіг посеред раундів).
# ═══════════════════════════════════════════════════════════════════════

quiz:
  title: "Космічні ракети"
  hashtag: "#вибори"

  # Вісь X — колонки зліва направо.
  x_axis:
    title: "краса"
    values: ["красиво", "нормально", "потворно"]

  # Вісь Y — рядки зверху вниз.
  # \n переносить підпис на новий рядок у самому чарті; у тексті поста
  # перенос замінюється пробілом. Корисно для довгих підписів, бо всі
  # значення однієї осі малюються спільним кеглем.
  y_axis:
    title: "ефективність"
    values: ["ефективно", "середньо", "марно"]

  round_minutes: 60           # тривалість одного раунду
  caption_update_minutes: 5   # як часто оновлювати відлік у підписі

  # Окреме оновлення підпису перед самим фінішем раунду, поза регулярною
  # сіткою: при раунді 60 хв і кроці 5 хв відлік іде 55 → 1 хвилина.
  # 0 = вимкнути.
  final_notice_seconds: 60

  # Секундні варіанти для тестових забігів. Якщо задані (не null) — мають
  # пріоритет над хвилинними. ⚠️ Відлік не може оновлюватись частіше, ніж
  # спрацьовує планувальник: підпис редагується лише під час тіка.
  round_seconds: null
  caption_update_seconds: null

  # Порядок заповнення клітинок:
  #   row_major     — рядками: зліва направо, зверху вниз
  #   column_major  — колонками: зверху вниз, зліва направо
  #   diagonal      — діагоналями від лівого верхнього кута
  #   random        — випадковий (фіксується один раз на старті)
  #   або явний список пар [рядок, колонка], нумерація з нуля:
  #     cell_order:
  #       - [0, 0]
  #       - [1, 1]
  cell_order: row_major

voting:
  # Пули емодзі. ⚠️ Telegram приймає як реакції лише свій фіксований набір:
  # кольорові сердечка (💙 💜 💚 🧡 💖 💗) він відхиляє. Селектор варіації
  # (U+FE0F) при підрахунку ігнорується, тож ❤ і ❤️ — одне й те саме.
  positive: ["👍", "🔥", "❤️", "😍", "🤩", "🥰"]
  negative: ["👎", "💩", "🖕", "🤮", "🥱"]

  one_entry_per_user: true    # друга й наступні картинки від того ж юзера ігноруються
  allow_self_votes: true      # реакція автора на власну заявку рахується
  allow_repeat_winner: true   # можна перемагати два раунди поспіль
  min_votes: 0                # мінімальний скор для перемоги; 0 = без порогу
  tie_breaker: earliest       # при рівному скорі: earliest | latest

  # Скільки важить одна людина:
  #   user     — максимум +1 / −1, скільки б емодзі з пулу вона не тицьнула
  #   reaction — рахується кожна реакція окремо
  # ⚠️ Звичайний користувач може поставити одну реакцію, власник Telegram
  # Premium — до трьох. Тобто при reaction преміум-акаунт важить утричі
  # більше за звичайний. Для публічного голосування чесніший user.
  vote_weight: user

telegram:
  # ID каналу з префіксом -100 (див. README, розділ «Як дізнатися ID»).
  # Групу обговорень вказувати не треба — вона визначається автоматично.
  channel_id: -100XXXXXXXXXX
  delete_previous_post: true  # видаляти пост попереднього раунду (разом з його коментарями)

render:
  width: 1200
  format: auto                # auto | mp4 | gif | png  (auto: mp4 якщо є ffmpeg, інакше gif)
  fps: 24
  loop_seconds: 2.2           # один повний оберт змійки навколо клітинки
  gif_max_width: 800          # GIF масштабується вниз — інакше файл роздувається
  snake_length: 0.22          # довжина змійки як частка периметра клітинки

  # Як вписувати картинки учасників (нічого не обрізаємо):
  #   square_tolerance — наскільки картинка може відхилятись від квадрата,
  #                      щоб її просто розтягнули; далі вписуємо цілком
  #   letterbox        — чим заповнювати поля: blur (розмита сама картинка) | color
  square_tolerance: 0.15
  letterbox: blur

  font: null                  # абсолютний шлях до .ttf; null = автопошук
  font_bold: null

  theme:
    background: "#ffffff"
    grid: "#111111"
    text: "#111111"
    muted: "#8a8a8a"
    empty_cell: "#f4f4f4"
    highlight: "#ff5c00"
    caption_bg: "#000000"
    caption_text: "#ffffff"

# ─── Шаблони текстів ───────────────────────────────────────────────────
# Доступні поля: {title} {hashtag} {round} {total} {cell} {x_value} {y_value}
#                {left} {left_min} {entries} {entries_human} {winners} {author} {score}
# {entries} — число заявок, {entries_human} — «поки жодної заявки» / «7 заявок».
# Лічильник оновлюється разом із відліком, тобто відстає не більше
# ніж на caption_update_*.
# Розмітка — HTML (<b>, <i>, <a href>).
templates:
  round_caption: |
    🗳 <b>{title}</b> — раунд {round}/{total}

    Заповнюємо клітинку: <b>{cell}</b>

    Кидайте свою картинку в коментарі під цим постом.
    Голосуйте 👍 / 👎 за чужі заявки — переможець займе клітинку в чарті.

    ⏳ Залишилось {left}  ·  🖼 {entries_human}

    {hashtag}

  finished_caption: |
    🏁 <b>{title}</b> — чарт заповнено!

    {winners}

    Дякую всім, хто малював, шукав і голосував.

    {hashtag}

  # Рядок на кожного переможця у фінальному пості
  winner_line: "<b>{cell}</b> — {author}"

  # Підпис під клітинкою в самому чарті (порожньо = не підписувати)
  cell_credit: "{author}"
